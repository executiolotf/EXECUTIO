name: Generate Weekly Insights Articles

on:
  schedule:
    - cron: '0 8 * * 1'  # Lundi 9h CET
    - cron: '0 8 * * 2'  # Mardi 9h CET
    - cron: '0 8 * * 4'  # Jeudi 9h CET
    - cron: '0 8 * * 5'  # Vendredi 9h CET
  workflow_dispatch:      # Déclenchement manuel

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Generate article
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: node .github/scripts/generate-article.js

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "EXECUTIO Bot"
          git add insights/ data/articles.json data/article-topics.json sitemap.xml
          git diff --cached --quiet || git commit -m "feat(insights): nouvel article — ${{ steps.gen.outputs.title }}"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && break
            echo "Push failed (attempt $i), retrying in 10s..."
            sleep 10
          done
